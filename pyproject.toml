[project]
name = "python-classwork"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mariam", email = "Maryam517@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "ipykernel>=7.4.0",
    "jolib>=0.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyqt6>=6.11.0",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
    "visualizer>=0.0.10",
    "yellowbrick>=1.5",
]

[project.scripts]
python-classwork = "python_classwork:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
